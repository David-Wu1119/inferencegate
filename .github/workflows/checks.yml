name: Synthetic checks

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ matrix.python }}

      - name: Record test tools
        run: |
          python --version
          ruby --version

      - name: Check GPU workflow trust boundary
        run: |
          python scripts/test_workflow_safety.py ci/example-workflow.yml
          python scripts/test_workflow_safety.py --self-test ci/example-workflow.yml

      - name: Run synthetic gate suite
        run: bash run_gate_tests.sh
        env:
          PYTHON: python
